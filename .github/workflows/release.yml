name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # oldest glibc we support
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tarball
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && version="${{ inputs.tag }}"
          version="${version#v}"
          name="yogfile-mcp-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/yogfile-mcp" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.tar.gz; do
            sha256sum "$f" >> "SHA256SUMS-${{ matrix.target }}.txt" 2>/dev/null \
              || shasum -a 256 "$f" >> "SHA256SUMS-${{ matrix.target }}.txt"
          done
      # Preuve cryptographique que ces artefacts sortent de ce workflow, à
      # ce commit : `gh attestation verify <file> --repo sifrah/yogfile-mcp`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm -f dist/SHA256SUMS-*.txt
          cp install.sh dist/
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
