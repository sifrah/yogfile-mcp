[package]
name = "yogfile-mcp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Yogfile for AI agents: an MCP server that uploads files and hands back share links that expire"
repository = "https://github.com/sifrah/yogfile-mcp"

[lib]
name = "yogfile_mcp"
path = "src/lib.rs"

[[bin]]
name = "yogfile-mcp"
path = "src/main.rs"

# Le connecteur hébergé (mcp.yogfile.com) : Streamable HTTP + OAuth.
[[bin]]
name = "yogfile-mcp-remote"
path = "src/bin/remote.rs"
required-features = ["remote"]

[features]
default = []
remote = [
    "dep:axum",
    "dep:chacha20poly1305",
    "dep:rand",
    "dep:hex",
    "dep:sha2",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# remote uniquement
axum = { version = "0.8", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
